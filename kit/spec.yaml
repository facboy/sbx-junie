schemaVersion: "2"
kind: sandbox
name: junie
displayName: Junie
description: The AI coding agent by JetBrains.
sandbox:
  # Built from the Dockerfile beside this spec: the base carries a Docker engine
  # and the com.docker.sandboxes.start-docker label, so `docker build` and
  # `compose` run against an engine inside the sandbox's own VM. The plain
  # `shell` base has no engine, and the host's daemon is unreachable from a
  # sandbox by design.
  #
  # Junie itself is not in it: the CLI is the host's own, mounted in and linked
  # by `junie-init.sh`. What the image adds is the libraries the host's Playwright
  # browsers link, which no template carries and which a mount cannot supply --
  # see "Browser libraries" in README.md.
  image: docker.io/facboy/junie-sbx:latest
  entrypoint:
    - junie
agentInstructions:
  filename: AGENTS.md
permissions:
  network:
    allow:
      # Use the host user's junie install, and the spec also sets
      # JUNIE_SKIP_UPDATE_CHECK=1, so the installed binary never checks for
      # or stages a runtime update. That drops github.com,
      # raw.githubusercontent.com, and release-assets.githubusercontent.com
      # from this list entirely: all three were reachable only for the
      # vendor installer's own version-resolution feed and the GitHub-hosted
      # release zip it downloads, and neither is a credential inject domain.
      # junie.jetbrains.com stays -- it doubles as the `junie` credential's
      # inject domain below, so it is still needed at runtime independent of
      # install.
      - junie.jetbrains.com
      - api.jetbrains.ai
      - api.anthropic.com
      - api.openai.com
      - generativelanguage.googleapis.com
      - api.x.ai
      - openrouter.ai
      # Junie inside the sandbox reaches a host IDE through the
      # `junie-ide-relayd` daemon, which rebinds every IDE onto one fixed
      # host loopback port -- the port below. The runtime classifies a dial
      # to host.docker.internal:<port> as localhost:<port> and enforces the
      # port, which is what makes this a real narrowing: the IDE plugin's own
      # ephemeral port is never named here and is not reachable from the
      # sandbox. See "Relay architecture" in README.md, and the host steps in
      # ../README.md.
      - localhost:27183
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: '%s'
  # v1 also accepted GOOGLE_GENERATIVE_AI_API_KEY as a fallback host env var
  # name for this credential (credentials.sources.google.env listed both).
  # v2's apiKey.name is a single string with no alias list, so only one host
  # env var can be recognized here; GEMINI_API_KEY is Google's current
  # canonical name for this key, so it's the one kept. A host with only
  # GOOGLE_GENERATIVE_AI_API_KEY set will no longer be picked up.
  - service: google
    apiKey:
      name: GEMINI_API_KEY
      proxyManaged: true
      inject:
        - domain: generativelanguage.googleapis.com
          header: x-goog-api-key
          format: '%s'
  - service: junie
    apiKey:
      name: JUNIE_API_KEY
      proxyManaged: true
      inject:
        - domain: junie.jetbrains.com
          header: Authorization
          format: Bearer %s
  - service: openai
    apiKey:
      name: OPENAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.openai.com
          header: Authorization
          format: Bearer %s
  - service: openrouter
    apiKey:
      name: OPENROUTER_API_KEY
      proxyManaged: true
      inject:
        - domain: openrouter.ai
          header: Authorization
          format: Bearer %s
  - service: xai
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.x.ai
          header: Authorization
          format: Bearer %s
environment:
  variables:
    # Seals the shim's own auto-update check (it would otherwise poll
    # update-info.jsonl and stage a new build). User has to do this from the host.
    JUNIE_SKIP_UPDATE_CHECK: "1"
    # The image ships only C, C.utf8 and POSIX, so a host's en_US.UTF-8 name
    # resolves back to ASCII here and only C.UTF-8 is any use. Unset, the JVM
    # takes ANSI_X3.4-1968 for the console and writes a ? for every non-ASCII
    # character, which is the TUI's borders and any accented text.
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
setup:
  startup:
    # Locates the host's IDE instance directory among the read-only workspaces
    # and relays this sandbox's own project to a loopback endpoint Junie can
    # reach, so `/ide` sees the same project the host has open, plus a mirror of
    # that IDE's built-in MCP server. A no-op when nothing is mounted -- see
    # "Relay architecture" in README.md.
    - command:
        - sh
        - /home/agent/.local/bin/junie-ide-relay.sh
      user: agent
      description: Relay this sandbox's host IDE, and its built-in MCP server, to loopback endpoints
    # A separate process group, and always forked (-f) so this entry returns as
    # soon as the watcher is started rather than waiting on it: `setsid` without
    # -f execs in place when its child is already a process-group leader, and the
    # entry would then never finish. The watcher repeats the pass above, so an
    # IDE opened on the host after the sandbox started is picked up without a
    # restart, and so an IDE that moved to a new MCP port is followed.
    - command:
        - setsid
        - -f
        - sh
        - /home/agent/.local/bin/junie-ide-relay.sh
        - --watch
      user: agent
      description: Watch for host IDEs opened later and relay them too
    # Init the home dir so the agent can see the host junie install
    - command:
        - sh
        - /home/agent/.local/bin/junie-init.sh
      user: agent
      description: Init the home dir so the agent can see the host junie install
    # Workaround for docs/fragmented-input-sequence.md: the CLI reads input one
    # sequence at a time with a 10 ms per-byte budget, so a sequence the pty
    # splits leaves its tail inserted as typed text -- `;20;8M` from a hover
    # report, `13u` from Enter. The filter holds each sequence until it ends and
    # writes it whole, and refuses all-motion reporting, which is the stream
    # that produces those fragments. Clicks and drags still report.
    # The symlink is removed first because `cp` onto it would write through to
    # the read-only host mount and fail.
    - command:
        - sh
        - -c
        - >-
          rm -f /home/agent/.local/bin/junie
          && cp /home/agent/.local/bin/junie-tty-filter.sh /home/agent/.local/bin/junie
          && chmod +x /home/agent/.local/bin/junie
      user: agent
      description: Install the terminal filter over the junie symlink
