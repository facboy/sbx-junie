schemaVersion: "2"
kind: sandbox
name: junie
displayName: Junie
description: The AI coding agent by JetBrains.
sandbox:
  # Use the host user's junie install
  image: docker/sandbox-templates:shell
  entrypoint:
    - junie
agentInstructions:
  filename: AGENTS.md
permissions:
  network:
    allow:
      # Use the host user's junie install, and the spec also sets
      # JUNIE_SKIP_UPDATE_CHECK=1, so the installed binary never checks for
      # or stages a runtime update. That drops github.com,
      # raw.githubusercontent.com, and release-assets.githubusercontent.com
      # from this list entirely: all three were reachable only for the
      # vendor installer's own version-resolution feed and the GitHub-hosted
      # release zip it downloads, and neither is a credential inject domain.
      # junie.jetbrains.com stays -- it doubles as the `junie` credential's
      # inject domain below, so it is still needed at runtime independent of
      # install.
      - junie.jetbrains.com
      - api.jetbrains.ai
      - api.anthropic.com
      - api.openai.com
      - generativelanguage.googleapis.com
      - api.x.ai
      - openrouter.ai
      # Junie inside the sandbox reaches a host IDE through the
      # `junie-ide-relayd` daemon, which rebinds every IDE onto one fixed
      # host loopback port -- the port below. The runtime classifies a dial
      # to host.docker.internal:<port> as localhost:<port> and enforces the
      # port, which is what makes this a real narrowing: the IDE plugin's own
      # ephemeral port is never named here and is not reachable from the
      # sandbox. See "Connecting to an IDE on the host" in README.md.
      - localhost:27183
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: '%s'
  # v1 also accepted GOOGLE_GENERATIVE_AI_API_KEY as a fallback host env var
  # name for this credential (credentials.sources.google.env listed both).
  # v2's apiKey.name is a single string with no alias list, so only one host
  # env var can be recognized here; GEMINI_API_KEY is Google's current
  # canonical name for this key, so it's the one kept. A host with only
  # GOOGLE_GENERATIVE_AI_API_KEY set will no longer be picked up.
  - service: google
    apiKey:
      name: GEMINI_API_KEY
      proxyManaged: true
      inject:
        - domain: generativelanguage.googleapis.com
          header: x-goog-api-key
          format: '%s'
  - service: junie
    apiKey:
      name: JUNIE_API_KEY
      proxyManaged: true
      inject:
        - domain: junie.jetbrains.com
          header: Authorization
          format: Bearer %s
  - service: openai
    apiKey:
      name: OPENAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.openai.com
          header: Authorization
          format: Bearer %s
  - service: openrouter
    apiKey:
      name: OPENROUTER_API_KEY
      proxyManaged: true
      inject:
        - domain: openrouter.ai
          header: Authorization
          format: Bearer %s
  - service: xai
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.x.ai
          header: Authorization
          format: Bearer %s
environment:
  variables:
    # Seals the shim's own auto-update check (it would otherwise poll
    # update-info.jsonl and stage a new build). User has to do this from the host.
    JUNIE_SKIP_UPDATE_CHECK: "1"
setup:
  startup:
    # Locates the host's IDE instance directory among the read-only workspaces
    # and relays this sandbox's own project to a loopback endpoint Junie can
    # reach, so `/ide` sees the same project the host has open. A no-op when
    # nothing is mounted -- see "Connecting to an IDE on the host" in README.md.
    - command:
        - sh
        - /home/agent/.local/bin/junie-ide-relay.sh
      user: agent
      description: Relay this sandbox's host IDE to a loopback endpoint
    # A separate process group, and always forked (-f) so this entry returns as
    # soon as the watcher is started rather than waiting on it: `setsid` without
    # -f execs in place when its child is already a process-group leader, and the
    # entry would then never finish. The watcher repeats the pass above, so an
    # IDE opened on the host after the sandbox started is picked up without a
    # restart.
    - command:
        - setsid
        - -f
        - sh
        - /home/agent/.local/bin/junie-ide-relay.sh
        - --watch
      user: agent
      description: Watch for host IDEs opened later and relay them too
    # Init the home dir so the agent can see the host junie install
    - command:
        - sh
        - /home/agent/.local/bin/junie-init.sh
      user: agent
      description: Init the home dir so the agent can see the host junie install
